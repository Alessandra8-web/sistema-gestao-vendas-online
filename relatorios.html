<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Gestão de Vendas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .menu {
            width: 230px;
            background: #17177a;
            color: white;
            padding: 30px 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo span {
            font-size: 35px;
        }

        .logo h2 {
            font-size: 18px;
            margin-top: 8px;
        }

        .menu nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
            margin-bottom: 8px;
            border-radius: 6px;
        }

        .menu nav a:hover,
        .menu nav a.ativo {
            background: rgba(255,255,255,0.15);
        }

        .conteudo {
            flex: 1;
            padding: 35px;
        }

        .cabecalho {
            margin-bottom: 30px;
        }

        .cabecalho h1 {
            color: #17177a;
            margin-bottom: 5px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card p {
            color: #666;
            margin-bottom: 8px;
        }

        .card h2 {
            color: #17177a;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .box h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 13px 10px;
            border-bottom: 1px solid #ddd;
        }

        th {
            color: #555;
        }

        .confirmado {
            color: green;
            font-weight: bold;
        }

        .pendente {
            color: #d58b00;
            font-weight: bold;
        }

        .botao {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 20px;
            border: none;
            border-radius: 5px;
            background: #17177a;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao:hover {
            background: #0e0e58;
        }

        @media print {
            .menu,
            .cabecalho p,
            .botao {
                display: none;
            }

            .conteudo {
                padding: 0;
            }

            body {
                background: white;
            }
        }

        @media (max-width: 800px) {
            .container {
                display: block;
            }

            .menu {
                width: 100%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .box {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <aside class="menu">

        <div class="logo">
            <span>🔊</span>
            <h2>Gestão de Vendas</h2>
        </div>

        <nav>
            <a href="dashboard.html">🏠 Dashboard</a>
            <a href="pedido.html">🛒 Pedidos</a>
            <a href="#">📦 Produtos</a>
            <a href="relatorios.html" class="ativo">📊 Relatórios</a>
            <a href="index.html">🚪 Sair</a>
        </nav>

    </aside>

    <main class="conteudo">

        <header class="cabecalho">
            <h1>Relatórios</h1>
            <p>Acompanhe o desempenho das vendas</p>
        </header>

        <section class="cards">

            <div class="card">
                <p>Total de pedidos</p>
                <h2 id="totalPedidos">24</h2>
            </div>

            <div class="card">
                <p>Vendas confirmadas</p>
                <h2 id="vendasConfirmadas">18</h2>
            </div>

            <div class="card">
                <p>Faturamento</p>
                <h2 id="faturamentoTotal">R$ 2.450,00</h2>
            </div>

        </section>

        <section class="box">
<div class="filtro-periodo">
    <label for="dataInicio">Data inicial:</label>
    <input type="date" id="dataInicio">

    <label for="dataFim">Data final:</label>
    <input type="date" id="dataFim">

    <button class="botao" onclick="gerarRelatorioPeriodo()">
        Gerar por período
    </button>
</div>
            <h2>Relatório de Vendas</h2>

            <table>
                <thead>
                    <tr>
                        <th>Pedido</th>
                        <th>Cliente</th>
                        <th>Produto</th>
                        <th>Valor</th>
                        <th>Pagamento</th>
                    </tr>
                </thead>

                <tbody id="tabelaPedidos">

                    
                </tbody>
            </table>

            <button class="botao" onclick="window.print()">
                🖨️ Emitir Relatório
            </button>

        </section>

    </main>

</div>

<script>
async function carregarRelatorio() {
    try {
        const resposta = await fetch("http://localhost:3000/relatorios/vendas");
        const dados = await resposta.json();
const respostaPedidos = await fetch("http://localhost:3000/pedidos");
const pedidos = await respostaPedidos.json();

const tabelaPedidos = document.getElementById("tabelaPedidos");

tabelaPedidos.innerHTML = "";

pedidos.forEach(pedido => {
    const linha = document.createElement("tr");

    linha.innerHTML = `
        <td>#${String(pedido.id).padStart(3, "0")}</td>
        <td>${pedido.cliente}</td>
        <td>${pedido.produto}</td>
        <td>${Number(pedido.valor_total).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        })}</td>
        <td class="${pedido.status === "Confirmado" ? "confirmado" : "pendente"}">
            ${pedido.status}
        </td>
    `;

    tabelaPedidos.appendChild(linha);
});
        document.getElementById("totalPedidos").textContent = dados.total_pedidos;
document.getElementById("vendasConfirmadas").textContent = dados.vendas_confirmadas;
document.getElementById("faturamentoTotal").textContent =
    Number(dados.faturamento_total).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
    } catch (erro) {
        console.error("Erro ao carregar relatório:", erro);
    }
}
async function gerarRelatorioPeriodo() {
    const inicio = document.getElementById("dataInicio").value;
    const fim = document.getElementById("dataFim").value;

    if (!inicio || !fim) {
        alert("Selecione a data inicial e a data final.");
        return;
    }

    try {
        const resposta = await fetch(
            `http://localhost:3000/relatorios/vendas/periodo?inicio=${inicio}&fim=${fim}`
        );

        const dados = await resposta.json();
        console.log("DADOS DO PERÍODO:", dados);

        document.getElementById("totalPedidos").textContent =
            dados.total_pedidos;

        document.getElementById("vendasConfirmadas").textContent =
            dados.vendas_confirmadas ?? 0;

        document.getElementById("faturamentoTotal").textContent =
            Number(dados.faturamento_total).toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });

    } catch (erro) {
        console.error("Erro ao gerar relatório por período:", erro);
        alert("Não foi possível gerar o relatório.");
    }
}


carregarRelatorio();
</script>



</body>
</html>
